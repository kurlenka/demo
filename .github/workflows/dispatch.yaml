name: Install snmp

on:
  workflow_dispatch:
    inputs:
      site_to_check:
        description: "Test to check"
        required: false
        #default: 'onliner.by'
jobs:
  prepare:
    #runs-on: [my_runner]
    runs-on: ubuntu-20.04
    steps:
      - name: Install snmp
        run: sudo apt update && sudo apt install -y snmp snmp-mibs-downloader
      - run: echo "snmp has been installed"
      - run: |
          sudo sed -i '/^mibs /s/^/#/' /etc/snmp/snmp.conf      
          sudo cat /etc/snmp/snmp.conf > snmp_report.log 2>&1
          touch /tmp/file.log
          ls -la
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          path: snmp_report.log

